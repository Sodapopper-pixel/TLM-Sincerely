plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            jvmArguments = [
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition'
            ]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // 把 MC/NeoForge 类接入 test 源集（memory/decision 单测需要 MC 类型）
    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // unitTest 接线会把 junit-fml（FML 的 JUnit 会话监听器，需要完整启动环境）带进测试运行时，
    // 纯单测（memory/decision）不需要它，排除后 JUnit 以普通模式运行。
    testRuntimeClasspath {
        exclude group: 'net.neoforged.fancymodloader', module: 'junit-fml'
    }
}

dependencies {
    implementation "maven.modrinth:touhou-little-maid:${tlm_version}"
    // Official Cloth Maven (Modrinth POM-only artifact is unreliable for MDG)
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // Jade integration (optional at runtime; API needed at compile time)
    compileOnly "maven.modrinth:jade:15.10.2+neoforge"
    // Maidsoul Kitchen integration (optional addon; compile-time API only)
    compileOnly "curse.maven:maidsoul-kitchen-1162577:7751437"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    // 中文 description 必须以 UTF-8 展开；缺省时随启动环境变（GBK 环境会产出非法 UTF-8 的 toml，
    // FML 扫描 mod 文件时直接 MalformedInputException）
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Implementation-Title'  : project.name,
                'Implementation-Version': "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def goldenMainClass = 'com.github.tartaricacid.tlm_sincerely.memory.GoldenDump'
tasks.register('generateGolden', JavaExec) {
    group = 'verification'
    description = 'Regenerate tools/memory-harness/fixtures/golden from Java authority impl'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = goldenMainClass
    args '--generate'
}
tasks.register('goldenCheck', JavaExec) {
    group = 'verification'
    description = 'Assert Java authority impl matches committed golden fixtures'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = goldenMainClass
}

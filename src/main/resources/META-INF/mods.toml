modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "tlm_sincerely"
version = "${mod_version}"
displayName = "TLM-Sincerely"
authors = "${mod_authors}"
description = '''东方小女仆附属模组 - 人格增强、工作优先与长期记忆系统'''

[[dependencies.tlm_sincerely]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.tlm_sincerely]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.tlm_sincerely]]
modId = "touhou_little_maid"
mandatory = true
versionRange = "[1.5.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tlm_sincerely]]
modId = "cloth_config"
mandatory = true
versionRange = "[11,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tlm_sincerely]]
modId = "jade"
mandatory = false
versionRange = "[11,)"
ordering = "AFTER"
side = "BOTH"

# 可选联动：MaidFileManager 的 .maid 档案导出/导入会经迁移 SPI 携带记忆数据；
# 桥接在运行时反射接入，SPI 自其 1.4.0 起提供。
[[dependencies.tlm_sincerely]]
modId = "maid_file_manager"
mandatory = false
versionRange = "[1.4,)"
ordering = "AFTER"
side = "BOTH"
